# examples/known_broken.yaml — known-broken examples allowlisted from
# the provider_smoke_test idempotency gate. Each entry: a directory
# path relative to examples/, the failure symptom, and a tracking
# ticket id in infrafactory/BACKLOG.md.
#
# Removing an entry is the closing step of the matching fidelity-fix
# ticket. If a dir on this list starts PASSING idempotency, the test
# FAILS ("congratulations, remove this entry") — ratchet-only-tighten.

entries:
  - dir: working/dns
    symptom: "second apply reports drift on DNS zone/record fields (DNS zone shape mismatch on read)"
    ticket: M44

  - dir: working/gke_cluster
    symptom: "apply fails deleting default node pool (404) — fakegcp container handler shape gap"
    ticket: M45

  - dir: working/load_balancer
    symptom: "second apply reports drift on forwarding_rule / backend_service / target_pool fields (LB compute resource handler shape gap)"
    ticket: M49

  - dir: working/storage
    symptom: "second apply reports drift on storage_bucket fields (uniform_bucket_level_access, updated, etc — handler doesn't echo provider-sent fields back on read)"
    ticket: M47

  # updates/ entries that hit the same underlying bug as their working/ peer.
  - dir: updates/update_dns_record
    symptom: "same root cause as working/dns (M44) — DNS record drift after apply v1"
    ticket: M44

  - dir: updates/update_storage_bucket
    symptom: "same root cause as working/storage (M47) — storage_bucket drift after apply v1"
    ticket: M47
